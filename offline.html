<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10131a">
<title>LearnOS — Offline</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    background:#0b0d11; color:#e6e9f0;
    font-family:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
    padding:24px; text-align:center; -webkit-font-smoothing:antialiased;
  }
  .card {
    width:100%; max-width:380px; padding:32px 28px;
    background:#171b24; border:1px solid rgba(148,160,184,0.14); border-radius:16px;
  }
  .logo { font-size:1.15rem; font-weight:600; letter-spacing:-0.02em; color:#f6f8fc; margin-bottom:24px; }
  .logo span { color:#8593f8; }
  .icon {
    width:48px; height:48px; margin:0 auto 20px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    background:#151922; border:1px solid rgba(148,160,184,0.14); color:#a0a9ba;
  }
  h1 { font-size:1.25rem; font-weight:600; letter-spacing:-0.01em; margin-bottom:8px; color:#f6f8fc; }
  p { color:#a0a9ba; font-size:0.9rem; line-height:1.6; margin-bottom:24px; }
  button {
    background:#4f5fe0; color:#fff; border:1px solid #4f5fe0; border-radius:8px;
    min-height:44px; padding:0 24px; font:inherit; font-size:0.9rem; font-weight:600;
    cursor:pointer; width:100%; transition:background-color .15s;
  }
  button:hover { background:#4453cf; border-color:#4453cf; }
  button:focus-visible { outline:2px solid #8593f8; outline-offset:2px; }
  .status { margin-top:16px; font-size:0.78rem; color:#808a9d; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Learn<span>OS</span></div>
    <div class="icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.9a10 10 0 0 1 14 0M8.5 16.4a5 5 0 0 1 7 0"/><path d="M12 20h.01"/><path d="m3 3 18 18"/></svg>
    </div>
    <h1>You're offline</h1>
    <p>No internet connection detected. Check your network and try again. Your data is safe in the cloud.</p>
    <button onclick="window.location.reload()">Try again</button>
    <div class="status" id="status">Waiting for connection…</div>
  </div>
  <script>
    window.addEventListener('online', () => {
      document.getElementById('status').textContent = 'Back online. Reloading…';
      setTimeout(() => window.location.href = '/', 1000);
    });
    setInterval(() => {
      if (navigator.onLine) {
        document.getElementById('status').textContent = 'Connected. Reloading…';
        setTimeout(() => window.location.href = '/', 500);
      }
    }, 3000);
  </script>
</body>
</html>
